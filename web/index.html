<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spam SMS Detection</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="icon">🛡️</div>

        <h1>Spam SMS Detection</h1>

        <p class="subtitle">
            Enter an SMS message below and find out if it's spam or not.
        </p>

        <div class="badge">
            ⚡ Fast &nbsp;•&nbsp; 🛡️ Safe &nbsp;•&nbsp; 🎯 Accurate
        </div>

        <textarea
            id="message"
            maxlength="500"
            placeholder="Type your SMS message here..."
            oninput="updateCharacterCount()"
        ></textarea>

        <div class="character-count">
            <span id="characterCount">0</span>/500
        </div>

        <button onclick="checkMessage()">
            🔍 Check Message
        </button>

        <div id="result" class="result-card">

            <div class="result-icon">
                🛡️
            </div>

            <div class="result-content">

                <h2>Prediction Result</h2>

                <p id="resultText">
                    The result will appear here after you check the message.
                </p>

                <div class="confidence-section">
                    <div class="confidence-header">
                        <span>📊 Confidence</span>
                        <span id="confidenceValue">—%</span>
                    </div>

                    <div class="confidence-bar">
                        <div id="confidenceFill"></div>
                    </div>
                </div>

            </div>

        </div>

        <footer>
            <p>Spam SMS Detection | Powered by Machine Learning</p>
            <p>💙 Stay Safe, Stay Smart</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
